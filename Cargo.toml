[package]
name = "windru"
version = "0.1.1"
edition = "2024"
description = "Локальный текстовый редактор для Windows"
publish = false

[[bin]]
name = "WindRu"
path = "src/main.rs"

[dependencies]
quick-xml = "0.42"
tempfile = "3"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_Storage_Xps",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
